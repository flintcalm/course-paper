<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - AirClick</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/x-icon" href="img/favicon.ico">
</head>
<body>
    <header>
        <a href="index.html" class="logo">
            <img src="img/logo-plane.png" alt="AirClick" class="logo-img">
            <span>Air</span><span>Click</span>
        </a>
        <nav>
            <ul>
                <li><a href="index.html">Главная</a></li>
                <li><a href="authy.html" class="active">Вход</a></li>
                <li><a href="reg.html">Регистрация</a></li>
            </ul>
        </nav>
    </header>

    <main class="auth">
        <h1 class="page-title">Вход в систему</h1>

        <div class="card">
            <p class="auth-error">Неверный логин или пароль</p>

            <form action="php/login.php" method="post">
                <div class="form-group">
                    <label for="login">Логин *</label>
                    <input type="text" id="login" name="login" placeholder="Введите логин" required>
                </div>

                <div class="form-group">
                    <label for="password">Пароль *</label>
                    <input type="password" id="password" name="password" placeholder="Введите пароль" required>
                </div>

                <button type="submit" class="btn btn-block">Войти</button>

                <div class="auth-links">
                    <a href="reg.html">Ещё не зарегистрированы? Регистрация</a>
                </div>
            </form>
        </div>
    </main>

    <footer>
        <div class="copyright">
            <p>&copy; 2013-2026 AirClick. Все права защищены.</p>
        </div>
    </footer>
</body>
</html>
